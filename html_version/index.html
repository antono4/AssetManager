<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AssetManager (HTML Version)</title>
<meta name="description" content="Static HTML/JS port of the AssetManager PHP app — IT & general asset management with dashboard, patching, reports, and more.">
<link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32.png">
<link rel="shortcut icon" href="assets/img/favicon.ico">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">

<!-- AdminLTE 3 (Bootstrap 4) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@3.2.0/dist/css/adminlte.min.css">
<!-- Font Awesome -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.1/css/all.min.css">
<!-- Bootstrap Icons -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<!-- Flag Icons -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flag-icon-css@3.5.0/css/flag-icon.min.css">
<!-- Google Font -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,400i,700">
<!-- Custom CSS -->
<link rel="stylesheet" href="assets/css/app.css">

<style>
    /* Boot loader shown until the app renders */
    #boot {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        background: #0f1729; color: #c2cbe0; font-family: 'Source Sans Pro', sans-serif;
        z-index: 9999; flex-direction: column; gap: 1rem;
    }
    #boot .logo {
        width: 64px; height: 64px; border-radius: 18px;
        background: linear-gradient(135deg, #4f7cff, #00d4a8);
        display: flex; align-items: center; justify-content: center; font-size: 1.7rem; color: #fff;
        box-shadow: 0 12px 30px rgba(79,124,255,.35);
        animation: pulse 1.4s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100%{transform:scale(1);} 50%{transform:scale(1.08);} }
    #boot p { margin: 0; font-size: .9rem; color: rgba(255,255,255,.5); }
    #boot .hint { font-size: .78rem; color: rgba(255,255,255,.3); margin-top: .5rem; }
    .hidden { display: none !important; }
</style>
</head>
<body>
<div id="boot">
    <div class="logo"><img src="assets/img/logo-mark.svg" alt="AssetManager" style="width:36px;height:36px"></div>
    <p>AssetManager (HTML)</p>
    <p class="hint">Loading…</p>
</div>
<noscript style="color:#ff6b6b;text-align:center;padding:2rem;display:block">This application requires JavaScript to run.</noscript>

<!-- ===== APP SHELL (persistent) ===== -->
<div id="app-root" class="hidden"></div>

<!-- jQuery + Bootstrap + AdminLTE + ApexCharts -->
<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/admin-lte@3.2.0/dist/js/adminlte.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.49.1/dist/apexcharts.min.js"></script>

<!-- App modules (order matters) -->
<script src="assets/js/store.js"></script>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/helpers.js"></script>
<script src="assets/js/router.js"></script>
<script src="assets/js/views.js"></script>
<script src="assets/js/pages.js"></script>
<script src="assets/js/pages2.js"></script>
<script src="assets/js/pages3.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
